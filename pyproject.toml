[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "passive-muon"
version = "0.1.0"
description = "Exact certificates and experiments for normalization-induced nonmonotonicity in finite-step Muon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mpmath>=1.3,<2",
  "numpy>=2.0,<3",
  "python-flint>=0.9,<0.10",
  "scipy>=1.14,<2",
  "sympy>=1.13,<2",
  "torch>=2.6,<3",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/passive_muon"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
