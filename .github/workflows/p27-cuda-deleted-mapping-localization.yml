name: P27 CUDA deleted-mapping localization preregistration replay

on:
  push:
    branches:
      - main
      - p27-cuda-deleted-mapping-localization
  pull_request:

permissions:
  contents: read

jobs:
  no-training-localization-contract:
    name: CPU preregistration, sanitization, and negative controls (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out complete frozen history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Reconstruct the terminal P26 outcome
        run: python scripts/reconstruct_p26_permission_safe_cuda_acquisition_outcome.py

      - name: Independently reconstruct the frozen P27 preregistration
        run: python scripts/reconstruct_p27_cuda_deleted_mapping_localization.py

      - name: Reconstruct the terminal P27 pre-container outcome
        run: python scripts/reconstruct_p27_cuda_deleted_mapping_localization_outcome.py

      - name: Run P27 contract and narrow sanitizer controls
        run: >-
          uv run --locked pytest -q
          tests/test_p27_cuda_deleted_mapping_localization_contract.py
          tests/test_p27_cuda_deleted_mapping_localization.py
          tests/test_p27_cuda_deleted_mapping_localization_orchestration.py
          tests/test_p27_cuda_deleted_mapping_localization_sanitizer.py
          tests/test_p27_p26_failure_ingestion.py
          tests/test_p27_cuda_deleted_mapping_localization_outcome.py
          tests/test_p23_deterministic_cuda_shadow_trace.py

      - name: Verify the one-shot host orchestration syntax
        run: bash -n scripts/run_p27_cuda_deleted_mapping_localization.sh

      - name: Prove unchanged scientific authorities remain byte-identical
        run: |
          git diff --exit-code p26-permission-safe-acquisition-checkpoint...HEAD -- \
            experiments/training/p21_shadow_trace_protocol.json \
            experiments/training/p22_real_gradient_shadow_trace_protocol.json \
            theory/p22_real_gradient_shadow_trace_protocol_erratum.md \
            results/summaries/p22_scalable_shield_shape_extension_certificate.json \
            experiments/training/p23_deterministic_cuda_shadow_trace_addendum.json \
            experiments/training/run_p23_deterministic_cuda_shadow_trace.py \
            src/passive_muon/p21_shadow_trace.py \
            experiments/training/p22_observed_muon.py

      - name: Check formatting, lint, and branch whitespace
        run: |
          uv run --locked ruff format --check src scripts experiments tests
          uv run --locked ruff check src scripts experiments tests
          git diff --check p26-permission-safe-acquisition-checkpoint...HEAD

      - name: State the evidence boundary
        run: >-
          echo "This CPU job reconstructs the terminal P26 stop, P27's one-shot
          no-training localization contract, the narrow exact-Python sanitizer
          correction, the separate native-path sanitizer policy, and fail-closed
          controls, and the terminal pre-container transfer stop. It does not
          create or attest a P27 container, observe a
          process mapping, acquire a CUDA gradient, prove repeatability or
          observer noninterference, capture a candidate, aggregate fidelity,
          execute a shield, update a parameter, or train a model."
