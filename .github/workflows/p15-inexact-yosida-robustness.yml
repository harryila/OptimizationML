name: P15 inexact-Yosida robustness replay

on:
  push:
    branches:
      - main
      - p15-inexact-yosida-robustness
  pull_request:

permissions:
  contents: read

jobs:
  inexact-yosida-robustness:
    name: Exact residual-oracle and robust PL replay (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with certificate history
        uses: actions/checkout@v7
        with:
          # Frozen source snapshots are checked at their recorded commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Generate the exact inexact-Yosida certificate
        run: >-
          uv run --locked python scripts/certify_inexact_yosida_robustness.py
          --output "$RUNNER_TEMP/inexact_yosida_robustness_certificate.json"

      - name: Independently reconstruct the fresh certificate
        run: >-
          uv run --locked python scripts/reconstruct_inexact_yosida_robustness.py
          --canonical "$RUNNER_TEMP/inexact_yosida_robustness_certificate.json"
          --require-canonical

      - name: Compare the committed canonical certificate
        run: >-
          uv run --locked python scripts/reconstruct_inexact_yosida_robustness.py
          --require-canonical

      - name: Run P15 theorem, controls, provenance, and replay tests
        run: >-
          uv run --locked pytest -q
          tests/test_inexact_yosida_robustness.py
          tests/test_inexact_yosida_robustness_cli.py
          tests/test_inexact_yosida_robustness_reconstruction.py
          tests/test_inexact_yosida_robustness_result_manifest.py
          tests/test_current_research_index.py
