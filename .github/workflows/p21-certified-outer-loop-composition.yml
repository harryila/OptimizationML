name: P21 certified outer-loop composition replay

on:
  push:
    branches:
      - main
      - p21-certified-outer-loop-composition
  pull_request:

permissions:
  contents: read

jobs:
  certified-outer-loop-composition:
    name: Exact composition, stored runtime, and shadow observer (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository with certificate history
        uses: actions/checkout@v7
        with:
          # P21 locks and replays the complete annotated P20 provenance chain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Generate the exact P21 composition certificate
        run: >-
          uv run --locked python
          scripts/certify_outer_loop_composition.py
          --output
          "$RUNNER_TEMP/certified_outer_loop_composition_certificate.json"

      - name: Independently reconstruct the fresh certificate
        run: >-
          uv run --locked python
          scripts/reconstruct_outer_loop_composition.py
          --canonical
          "$RUNNER_TEMP/certified_outer_loop_composition_certificate.json"
          --require-canonical

      - name: Compare the committed canonical certificate
        run: >-
          uv run --locked python
          scripts/reconstruct_outer_loop_composition.py
          --require-canonical

      - name: Run the synthetic CPU shadow observer (not real-gradient evidence)
        run: >-
          uv run --locked python
          experiments/training/run_p21_synthetic_shadow_trace.py
          --output "$RUNNER_TEMP/p21_synthetic_shadow_trace.json"

      - name: Run focused P21 theorem, runtime, roundoff, reconstruction, and shadow tests
        run: >-
          uv run --locked pytest -q
          tests/test_certified_outer_loop_composition_certificate.py
          tests/test_certified_outer_loop_composition.py
          tests/test_certified_outer_loop_roundoff.py
          tests/test_certified_outer_loop_composition_cli.py
          tests/test_certified_outer_loop_composition_reconstruction.py
          tests/test_p21_shadow_trace.py

      - name: Check formatting, lint, and branch whitespace
        run: |
          uv run --locked ruff format --check src scripts experiments tests
          uv run --locked ruff check src scripts experiments tests
          git diff --check p20-scalable-mixed-precision-sector-shield-final-checkpoint...HEAD
