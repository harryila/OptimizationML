name: P9 scalable mixed-precision replay

on:
  push:
    branches:
      - p9-scalable-mixed-precision
  pull_request:

permissions:
  contents: read

jobs:
  exact-and-kernel:
    name: Exact shape replay and reference kernel (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Replay the exact scalable mixed-precision certificate
        run: >-
          uv run --locked python scripts/certify_scalable_mixed_precision.py
          --output "$RUNNER_TEMP/scalable_mixed_precision_certificate.json"

      - name: Independently reconstruct the fresh certificate
        run: >-
          uv run --locked python scripts/reconstruct_scalable_mixed_precision.py
          --canonical "$RUNNER_TEMP/scalable_mixed_precision_certificate.json"
          --require-canonical

      - name: Compare the committed canonical certificate
        run: >-
          uv run --locked python scripts/reconstruct_scalable_mixed_precision.py
          --require-canonical

      - name: Replay the modest native-matmul diagnostic
        run: >-
          uv run --locked python
          experiments/mixed_precision/run_scalable_mixed_precision_diagnostic.py
          --output "$RUNNER_TEMP/scalable_mixed_precision_diagnostic.json"

      - name: Run P9 integrity and reference-kernel tests
        run: >-
          uv run --locked pytest -q
          tests/test_scalable_mixed_precision.py
          tests/test_scalable_mixed_precision_certificate.py
          tests/test_scalable_mixed_precision_cli.py
          tests/test_scalable_mixed_precision_reconstruction.py
          tests/test_scalable_mixed_precision_diagnostic.py
