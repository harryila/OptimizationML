name: P18 sector-projected useful-rate replay

on:
  push:
    branches:
      - main
      - p18-sector-projected-useful-rate
  pull_request:

permissions:
  contents: read

jobs:
  sector-projected-useful-rate:
    name: Exact sector, PL frontier, and fidelity replay (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with certificate history
        uses: actions/checkout@v7
        with:
          # P18 checks the frozen P17 checkpoint and source/artifact history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Generate the exact and Arb P18 certificate
        run: >-
          uv run --locked python scripts/certify_sector_projected_useful_rate.py
          --output "$RUNNER_TEMP/sector_projected_useful_rate_certificate.json"

      - name: Independently reconstruct the fresh certificate
        run: >-
          uv run --locked python scripts/reconstruct_sector_projected_useful_rate.py
          --canonical "$RUNNER_TEMP/sector_projected_useful_rate_certificate.json"
          --require-canonical

      - name: Compare the committed canonical certificate
        run: >-
          uv run --locked python scripts/reconstruct_sector_projected_useful_rate.py
          --require-canonical

      - name: Replay the deterministic spectrum and control study
        run: >-
          uv run --locked python experiments/resolvent/run_p18_sector_projected_study.py
          --output "$RUNNER_TEMP/p18_sector_projected_study.json"

      - name: Run P18 theorem, fidelity, provenance, and index tests
        run: >-
          uv run --locked pytest -q
          tests/test_sector_projected_resolvent.py
          tests/test_sector_projected_resolvent_certificate.py
          tests/test_sector_projected_resolvent_cli.py
          tests/test_sector_projected_resolvent_reconstruction.py
          tests/test_p18_sector_projected_study.py
          tests/test_current_research_index.py

      - name: Check formatting and lint
        run: |
          uv run --locked ruff format --check src scripts experiments tests
          uv run --locked ruff check src scripts experiments tests
