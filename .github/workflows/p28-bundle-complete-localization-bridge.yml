name: P28 bundle-complete localization bridge preregistration replay

on:
  push:
    branches:
      - main
      - p28-bundle-complete-localization-bridge
  pull_request:

permissions:
  contents: read

jobs:
  bundle-complete-no-training-contract:
    name: CPU bundle closure and bridge controls (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out complete frozen history and annotated tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Reconstruct terminal P27 and the unchanged localization contract
        run: |
          python scripts/reconstruct_p27_cuda_deleted_mapping_localization.py
          python scripts/reconstruct_p27_cuda_deleted_mapping_localization_outcome.py

      - name: Independently reconstruct the P28 bridge contract
        run: python scripts/reconstruct_p28_bundle_complete_localization_bridge.py

      - name: Run bundle verifier, orchestration, contract, and unchanged P27 controls
        run: >-
          uv run --locked pytest -q
          tests/test_p28_bundle_complete_localization_bridge_contract.py
          tests/test_p28_control_bundle_verifier.py
          tests/test_p28_bundle_complete_localization_bridge_orchestration.py
          tests/test_p27_cuda_deleted_mapping_localization_contract.py
          tests/test_p27_cuda_deleted_mapping_localization.py
          tests/test_p27_cuda_deleted_mapping_localization_orchestration.py
          tests/test_p27_cuda_deleted_mapping_localization_sanitizer.py
          tests/test_p27_p26_failure_ingestion.py
          tests/test_p27_cuda_deleted_mapping_localization_outcome.py

      - name: Verify host orchestration syntax
        run: bash -n scripts/run_p28_bundle_complete_localization_bridge.sh

      - name: Prove P27 execution authorities remain byte-identical
        run: |
          git diff --exit-code p27-cuda-deleted-mapping-localization-diagnostic...HEAD -- \
            experiments/training/p27_cuda_deleted_mapping_localization_contract.json \
            experiments/training/run_p27_cuda_deleted_mapping_localization.py \
            scripts/reconstruct_p27_cuda_deleted_mapping_localization.py \
            scripts/run_p27_cuda_deleted_mapping_localization.sh \
            scripts/ingest_p26_trace_off_a_failure.py \
            experiments/training/p23_deterministic_cuda_shadow_trace.py \
            scripts/sanitize_p27_cuda_deleted_mapping_localization.py \
            tests/test_p27_cuda_deleted_mapping_localization.py \
            tests/test_p27_cuda_deleted_mapping_localization_orchestration.py \
            tests/test_p27_cuda_deleted_mapping_localization_sanitizer.py \
            tests/test_p27_p26_failure_ingestion.py

      - name: Check formatting, lint, and branch whitespace
        run: |
          uv run --locked ruff format --check src scripts experiments tests
          uv run --locked ruff check src scripts experiments tests
          git diff --check p27-cuda-deleted-mapping-localization-diagnostic...HEAD

      - name: State the evidence boundary
        run: >-
          echo "This CPU job reconstructs the terminal P27 transfer stop, the
          unchanged P27 no-training localizer authorities, P28's exact five-ref
          full-bundle contract, and fail-closed bundle/verifier controls. It
          does not authenticate a remote receipt, create an attempt root or
          container, initialize CUDA, observe a mapping, run localization,
          acquire a gradient, capture a candidate, execute a shield, update a
          parameter, or train a model."
