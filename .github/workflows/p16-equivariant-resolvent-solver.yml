name: P16 equivariant resolvent solver replay

on:
  push:
    branches:
      - main
      - p16-equivariant-resolvent-solver
  pull_request:

permissions:
  contents: read

jobs:
  equivariant-resolvent-solver:
    name: Exact reduction, FP64 solver, and fidelity replay (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository with certificate history
        uses: actions/checkout@v7
        with:
          # Frozen P15 source and artifact snapshots are replayed by commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Generate the exact equivariant-resolvent certificate
        run: >-
          uv run --locked python scripts/certify_equivariant_resolvent_solver.py
          --output "$RUNNER_TEMP/equivariant_resolvent_solver_certificate.json"

      - name: Independently reconstruct the fresh certificate
        run: >-
          uv run --locked python scripts/reconstruct_equivariant_resolvent_solver.py
          --canonical "$RUNNER_TEMP/equivariant_resolvent_solver_certificate.json"
          --require-canonical

      - name: Compare the committed canonical certificate
        run: >-
          uv run --locked python scripts/reconstruct_equivariant_resolvent_solver.py
          --require-canonical

      - name: Replay the deterministic solver and fidelity study
        run: >-
          uv run --locked python experiments/resolvent/run_p16_solver_study.py
          --output "$RUNNER_TEMP/p16_solver_study.json"

      - name: Run P16 theorem, solver, controls, provenance, and index tests
        run: >-
          uv run --locked pytest -q
          tests/test_equivariant_resolvent_certificate.py
          tests/test_equivariant_resolvent_solver.py
          tests/test_p16_solver_study.py
          tests/test_equivariant_resolvent_solver_cli.py
          tests/test_equivariant_resolvent_solver_reconstruction.py
          tests/test_equivariant_resolvent_solver_result_manifest.py
          tests/test_current_research_index.py
