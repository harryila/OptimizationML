name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  locked-tests:
    name: Locked tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Execute the exact canonical witness
        run: uv run --locked python scripts/find_counterexample.py --output "$RUNNER_TEMP/canonical_witness.json"
