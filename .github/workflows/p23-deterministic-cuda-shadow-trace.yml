name: P23 deterministic CUDA shadow-trace contract replay

on:
  push:
    branches:
      - main
      - p23-deterministic-cuda-shadow-trace
  pull_request:

permissions:
  contents: read

jobs:
  preregistration-contract:
    name: CPU contract, provenance, and fail-closed verifier (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository with frozen P22 history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Validate the P23 addendum and inherited artifact hashes
        run: >-
          uv run --locked python -c
          "from experiments.training.p23_deterministic_cuda_shadow_trace
          import load_and_validate_addendum;
          p=load_and_validate_addendum();
          assert p['status']=='frozen_pre_acquisition_cuda_runtime_lock_pending'"

      - name: Regenerate the inherited exact fused-QKV shape certificate
        run: >-
          uv run --locked python
          scripts/certify_p22_scalable_shield_shape_extension.py
          --output
          "$RUNNER_TEMP/p22_scalable_shield_shape_extension_certificate.json"

      - name: Independently reconstruct the inherited certificate
        run: >-
          uv run --locked python
          scripts/reconstruct_p22_scalable_shield_shape_extension.py
          --canonical
          "$RUNNER_TEMP/p22_scalable_shield_shape_extension_certificate.json"
          --require-canonical

      - name: Run P23 CPU contract and hardened P22/P23 boundary tests
        run: >-
          uv run --locked pytest -q
          tests/test_p23_deterministic_cuda_shadow_trace.py
          tests/test_p23_cuda_acquisition_runner.py
          tests/test_p23_runtime_recipe.py
          tests/test_p22_real_gradient_shadow_trace.py
          tests/test_p22_real_gradient_observer.py
          tests/test_p22_scalable_shield_shape_extension.py
          tests/test_p22_scalable_shield_shape_extension_reconstruction.py
          tests/test_current_research_index.py

      - name: Check formatting, lint, and branch whitespace
        run: |
          uv run --locked ruff format --check src scripts experiments tests
          uv run --locked ruff check src scripts experiments tests
          git diff --check p22-real-gradient-shadow-trace-diagnostic...HEAD

      - name: State the acquisition boundary
        run: >-
          echo "This CPU job validates the frozen P23 contract, inherited exact
          shape certificate, provenance logic, and fail-closed fixtures. It
          neither runs CUDA nor supplies real-gradient fidelity evidence."
