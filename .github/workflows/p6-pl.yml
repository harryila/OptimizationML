name: P6 smooth-PL replay

on:
  push:
    branches:
      - p6-pl-convergence
  pull_request:

permissions:
  contents: read

jobs:
  exact-and-falsification:
    name: Exact PL LMI and nonconvex probe (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Replay the exact smooth-PL certificate
        run: >-
          uv run --locked python scripts/certify_pl_convergence.py
          --output "$RUNNER_TEMP/pl_convergence_certificate.json"

      - name: Replay the nonconvex PL falsification grid
        run: >-
          uv run --locked python experiments/nonconvex/run_pl_falsification.py
          --output "$RUNNER_TEMP/pl_falsification.json"

      - name: Run P6 integrity tests
        run: >-
          uv run --locked pytest -q
          tests/test_pl_convergence.py
          tests/test_pl_convergence_cli.py
          tests/test_pl_experiment.py
          tests/test_pl_results.py
